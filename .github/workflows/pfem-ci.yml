name: PFEM2D build and run (deal.II official image)

on:
  push:
    branches: [ main, master, PFEM ]
  pull_request:
    branches: [ main, master, PFEM ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # 整个 job 在 deal.II 官方 Docker 镜像中执行
    # 这里用的是一个通用的带 MPI 的 release 镜像，你可以按需换版本
    container:
      image: dealii/dealii:v9.4.2-focal  # 示例：deal.II 9.4.2 + Ubuntu 20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 在官方镜像里，常用工具已经装好（cmake, ninja, compilers 等）
      # 一般不需要再 apt-get 安装，如果需要额外的包可以在这里加

      - name: Configure PFEM example
        working-directory: ./dealii+pfem
        run: |
          mkdir -p build
          cd build
          # In deal.II Docker images, DEAL_II_DIR env var should be set
          # If not, CMake's find_package will search standard paths
          if [ -n "$DEAL_II_DIR" ]; then
            echo "Using DEAL_II_DIR=$DEAL_II_DIR"
            cmake -G Ninja -DDEAL_II_DIR="$DEAL_II_DIR" ..
          else
            echo "DEAL_II_DIR not set, trying find_package discovery"
            cmake -G Ninja ..
          fi

      - name: Build PFEM example
        working-directory: ./dealii+pfem/build
        run: |
          ninja -v

      - name: Run pfem_sloshing_simple
        working-directory: ./dealii+pfem/build
        run: |
          # 使用默认参数运行简化版本
          ./pfem_sloshing_simple
          echo "pfem_sloshing_simple finished."
          ls -R
          # 检查是否生成了第一个 VTK 输出文件
          test -f output/sloshing_000000.vtk
